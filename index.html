<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07080F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mohey HQ">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src https://script.google.com https://script.googleusercontent.com; img-src 'self' data: blob:; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<title>Mohey HQ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080F;--panel:#0E1020;--panel2:#141731;--text:#EAF0FF;--muted:#93A0BE;--dim:#5C6A88;
  --cyan:#5CF2FF;--pink:#FF2E93;--pinkSoft:#FF8CC4;--green:#3BFF9E;--amber:#FFB547;
  --holo:linear-gradient(110deg,#FFD1EC,#C9B6FF,#A6F4FF,#FFF0B8,#FFD1EC);
  --line:rgba(234,240,255,.12);--spring:cubic-bezier(.2,.9,.3,1.2);
  --tx:0deg;--ty:0deg;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overscroll-behavior:none}
body{background-image:linear-gradient(rgba(120,140,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(120,140,255,.06) 1px,transparent 1px);background-size:26px 26px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--cyan)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.grot{font-family:'Space Grotesk',sans-serif}
.lbl{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
.holo{background:var(--holo);background-size:200% 100%;animation:holo 7s linear infinite}
.holo-text{background:var(--holo);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:holo 6s linear infinite}
@keyframes holo{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes blip{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes blipS{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
@keyframes sweep{to{transform:rotate(360deg)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,46,147,.55)}100%{box-shadow:0 0 0 18px rgba(255,46,147,0)}}
@keyframes enter{from{opacity:0;transform:translateY(26px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:translateY(60px) scale(.4)}70%{transform:translateY(-6px) scale(1.06)}100%{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fill{from{width:0}to{width:100%}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ripple{from{transform:scale(0);opacity:.6}to{transform:scale(4);opacity:0}}
@keyframes caret{50%{opacity:0}}

#app{position:fixed;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;overflow-x:hidden;padding:calc(var(--safe-t) + 18px) 18px calc(var(--safe-b) + 120px);-webkit-overflow-scrolling:touch}
.screen.on{display:flex;animation:enter .45s var(--spring) both}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.col{display:flex;flex-direction:column}
.gap6{gap:6px}.gap10{gap:10px}.gap14{gap:14px}
.iconbtn{width:42px;height:42px;border-radius:13px;border:1px solid rgba(234,240,255,.2);background:transparent;display:flex;align-items:center;justify-content:center;color:var(--text);flex-shrink:0}
.iconbtn:active{transform:scale(.92)}
.chip{height:34px;padding:0 14px;border-radius:999px;border:1px solid rgba(234,240,255,.2);background:transparent;color:var(--text);font-size:13px;flex-shrink:0;white-space:nowrap}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:700}
.chip.dim{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.btn{height:52px;border-radius:16px;border:0;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--text);color:var(--bg)}
.btn.green{background:var(--green);color:#03200F}
.btn.ghost{background:transparent;border:1px solid rgba(234,240,255,.25);color:var(--text)}
.btn.cyan{background:rgba(92,242,255,.12);border:1px solid rgba(92,242,255,.5);color:var(--cyan)}
.btn[disabled]{opacity:.5}
.block{width:100%}
.card{border-radius:20px;border:1px solid var(--line);background:rgba(14,16,32,.75);padding:14px}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:1px}
.p-hot{background:rgba(255,46,147,.18);color:var(--pinkSoft)}
.p-warm{background:rgba(255,181,71,.16);color:var(--amber)}
.p-cool{background:rgba(92,242,255,.14);color:var(--cyan)}
.p-ok{background:rgba(59,255,158,.15);color:var(--green)}
.p-dim{background:rgba(234,240,255,.08);color:var(--muted)}
.inp{width:100%;min-height:46px;border-radius:14px;border:1px solid rgba(234,240,255,.16);background:rgba(234,240,255,.05);padding:12px 14px;color:var(--text);outline:none;font-size:15px}
.inp:focus{border-color:var(--cyan)}
textarea.inp{min-height:90px;resize:vertical}
select.inp{appearance:none}
.flabel{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.4px;color:var(--muted);margin:12px 0 6px;display:block;text-transform:uppercase}
.muted{color:var(--muted)}
.small{font-size:12px}
.status-line{min-height:18px;font-size:13px;color:var(--amber);margin-top:8px}
.empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:14px}

/* status strip */
.strip{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.8px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.live{background:var(--green);animation:blip 1.6s infinite}

/* queue deck */
.deck{position:relative;height:360px;margin-top:10px;perspective:900px}
.qcard{position:absolute;left:0;right:0;top:26px;height:316px;border-radius:30px;padding:2px;touch-action:none;will-change:transform}
.qcard.top{background:var(--holo);background-size:200% 100%;animation:holo 7s linear infinite;box-shadow:0 40px 70px -24px rgba(201,182,255,.5);transform:rotateX(var(--ty)) rotateY(var(--tx))}
.qcard.b1{top:12px;left:12px;right:12px;background:rgba(166,244,255,.2);transform:translateZ(-45px)}
.qcard.b2{top:0;left:26px;right:26px;background:rgba(201,182,255,.16);transform:translateZ(-90px)}
.qcard .inner{height:100%;border-radius:28px;background:#0E1020;padding:18px;display:flex;flex-direction:column;gap:9px;overflow:hidden;position:relative}
.qcard .stamp{position:absolute;top:18px;padding:6px 12px;border-radius:10px;border:2px solid;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;letter-spacing:1px;opacity:0}
.stamp.r{right:18px;color:var(--green);border-color:var(--green);transform:rotate(8deg)}
.stamp.l{left:18px;color:var(--amber);border-color:var(--amber);transform:rotate(-8deg)}
.stamp.u{left:50%;transform:translateX(-50%);color:var(--cyan);border-color:var(--cyan)}
.qtitle{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;line-height:1.1;letter-spacing:-.6px}
.qbody{font-size:13px;line-height:1.45;color:#D6DEF5;padding:12px;border-radius:16px;background:rgba(234,240,255,.06);overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.hints{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--muted);margin-top:auto}
.hints .go{color:var(--green);animation:nudge 1.4s ease-in-out infinite}
.actions{display:flex;justify-content:center;gap:22px;align-items:center;margin-top:8px}
.round{border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid rgba(234,240,255,.25);background:rgba(234,240,255,.05);color:var(--text);transition:transform .15s var(--spring)}
.round:active{transform:scale(.88)}
.done-state{display:flex;flex-direction:column;align-items:center;gap:10px;padding:60px 10px;text-align:center}

/* dock */
#dock{position:fixed;left:18px;right:18px;bottom:calc(var(--safe-b) + 18px);height:72px;border-radius:26px;background:rgba(14,16,32,.92);border:1px solid rgba(92,242,255,.25);display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:20;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:transform .35s var(--spring),opacity .25s}
#dock.hide{transform:translateY(130%);opacity:0;pointer-events:none}
.dockbtn{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);background:none;border:0;font-family:'JetBrains Mono',monospace;font-size:10px;width:66px}
.dockbtn.on{color:var(--cyan)}
#capBtn{width:76px;height:76px;margin-top:-38px;border-radius:50%;border:4px solid var(--bg);display:flex;align-items:center;justify-content:center;color:var(--bg);animation:holo 6s linear infinite,ring 2.4s ease-out infinite;background:var(--holo);background-size:200% 100%;touch-action:none;transition:transform .25s var(--spring)}
#capBtn.open{transform:rotate(45deg);background:var(--text);animation:none}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--pink);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* capture fan */
#fan{position:fixed;inset:0;z-index:19;display:none;background:radial-gradient(circle at 50% 92%,rgba(201,182,255,.28),rgba(7,8,15,.9) 55%);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#fan.on{display:block;animation:fade .2s both}
.fanitem{position:absolute;display:flex;flex-direction:column;align-items:center;gap:6px;width:76px;margin-left:-38px;animation:pop .45s var(--spring) both}
.fanitem button{width:64px;height:64px;border-radius:50%;border:1px solid rgba(234,240,255,.25);background:rgba(14,16,32,.95);color:var(--text);display:flex;align-items:center;justify-content:center;transition:transform .15s var(--spring)}
.fanitem.hot button,.fanitem.main button{width:74px;height:74px;border:0;background:var(--holo);background-size:200% 100%;animation:holo 5s linear infinite;color:var(--bg);box-shadow:0 0 36px rgba(201,182,255,.6)}
.fanitem.hover button{transform:scale(1.18)}
.fanitem span{font-size:11px;font-weight:600;color:#D6DEF5;text-align:center}
.fansug{position:absolute;left:18px;right:18px;top:calc(var(--safe-t) + 40px)}
.fanmore{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}

/* sheet */
#sheetBg{position:fixed;inset:0;background:rgba(3,4,10,.65);z-index:40;display:none}
#sheetBg.on{display:block;animation:fade .2s both}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--panel);border-top:1px solid rgba(201,182,255,.35);border-radius:28px 28px 0 0;z-index:41;padding:10px 18px calc(var(--safe-b) + 24px);display:none}
#sheet.on{display:block;animation:up .35s var(--spring) both}
.grab{width:42px;height:4px;border-radius:2px;background:rgba(234,240,255,.25);margin:0 auto 12px}
.sheet-title{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin:0 0 4px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;padding-top:2px}

/* toast */
#toast{position:fixed;left:50%;top:calc(var(--safe-t) + 14px);transform:translateX(-50%) translateY(-220%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:60;transition:transform .35s var(--spring);max-width:90%;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}

/* brief */
#brief{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column;padding:calc(var(--safe-t) + 16px) 22px calc(var(--safe-b) + 24px);background-image:inherit;background-size:26px 26px}
#brief.on{display:flex;animation:fade .3s both}
.bars{display:grid;gap:5px}
.bar{height:3px;border-radius:2px;background:rgba(234,240,255,.2);overflow:hidden}
.bar i{display:block;height:3px;background:var(--text);width:0}
.bar.done i{width:100%}
.bar.now i{animation:fill 6s linear forwards}
.bar.now.paused i{animation-play-state:paused}
.slide{flex:1;display:flex;flex-direction:column;gap:20px;padding-top:22px;animation:enter .5s var(--spring) both;overflow:hidden}
.bigline{font-family:'Space Grotesk',sans-serif;font-size:34px;line-height:1.06;font-weight:700;letter-spacing:-1.2px;margin:0}
.holocard{border-radius:26px;padding:18px;color:#120C1C;display:flex;flex-direction:column;gap:10px;box-shadow:0 30px 60px -20px rgba(201,182,255,.45);transform:rotateX(var(--ty)) rotateY(var(--tx));transition:transform .2s}
.tapzones{position:absolute;inset:80px 0 120px;display:grid;grid-template-columns:1fr 2fr}

/* territory */
.seg{display:grid;padding:4px;border-radius:14px;background:rgba(234,240,255,.06);gap:4px}
.seg button{height:36px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px}
.seg button.on{background:var(--text);color:var(--bg);font-weight:700}
.seg.holo-on button.on{background:var(--holo);background-size:200% 100%;animation:holo 6s linear infinite;color:var(--bg)}
.radar{position:relative;width:min(84vw,320px);aspect-ratio:1;align-self:center;border-radius:50%;border:1px solid rgba(92,242,255,.4);background:radial-gradient(circle,rgba(92,242,255,.08),transparent 70%);margin:14px 0}
.radar .ring{position:absolute;border-radius:50%;border:1px solid rgba(92,242,255,.2)}
.radar .sw{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(201,182,255,0) 0deg,rgba(201,182,255,0) 290deg,rgba(201,182,255,.5) 360deg);animation:sweep 4s linear infinite;pointer-events:none}
.blip{position:absolute;display:flex;flex-direction:column;align-items:center;gap:2px;transform:translate(-50%,-50%);background:none;border:0;padding:6px}
.blip i{border-radius:50%;display:block;animation:blipS 2s infinite}
.blip b{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;color:#BFF8FF;white-space:nowrap}
.blip.sel b{color:#fff;font-weight:700}
.lrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(234,240,255,.08);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:var(--text)}
.sdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.wa{width:40px;height:40px;border-radius:12px;border:0;background:rgba(59,255,158,.15);color:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fbar{height:30px;border-radius:9px;background:var(--holo);background-size:200% 100%;animation:holo 8s linear infinite;transition:width .6s var(--spring)}

/* quote */
.qline{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid rgba(234,240,255,.08);background:none;border-left:3px solid transparent;width:100%;text-align:left;color:var(--text)}
.qline.act{background:rgba(201,182,255,.1);border-left-color:#C9B6FF}
.qline .f{font-family:'JetBrains Mono',monospace;font-size:13px;padding:2px 4px;border-radius:6px}
.qline .f.act{background:rgba(92,242,255,.18);color:#fff}
.keypad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.keypad button{height:52px;border-radius:14px;border:0;background:rgba(234,240,255,.07);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:20px;transition:transform .1s}
.keypad button:active{transform:scale(.92);background:rgba(234,240,255,.16)}
.keypad .k2{font-size:12px;font-weight:700;color:var(--muted)}
.keypad .k2.on{background:rgba(92,242,255,.14);color:var(--cyan)}
.total{border-radius:22px;padding:14px 16px;color:var(--bg);display:flex;justify-content:space-between;align-items:flex-end}

/* jobs */
.tl{display:flex;gap:12px;align-items:center;padding:9px 0}
.tl .t{font-family:'JetBrains Mono',monospace;font-size:12px;width:46px;flex-shrink:0}
.tl.past{opacity:.5}
.tl.next{background:rgba(92,242,255,.08);border-radius:12px;padding:9px 10px;margin:0 -10px}
.nowline{display:flex;gap:12px;align-items:center;padding:4px 0}
.nowline i{flex:1;height:1px;background:linear-gradient(90deg,var(--pink),transparent)}
.req{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid rgba(234,240,255,.08)}

/* pull to refresh */
#ptr{position:fixed;left:50%;top:calc(var(--safe-t) + 6px);width:36px;height:36px;margin-left:-18px;border-radius:50%;border:2px solid var(--cyan);border-top-color:transparent;z-index:25;opacity:0;transform:translateY(-40px)}
#ptr.spin{animation:spin .8s linear infinite;opacity:1;transform:none}
.rip{position:fixed;width:120px;height:120px;border-radius:50%;background:rgba(201,182,255,.35);pointer-events:none;z-index:24;animation:ripple .7s ease-out forwards}

/* pair */
#pair{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;justify-content:center;padding:24px;gap:14px}
#pair.on{display:flex}
</style>
</head>
<body>
<div id="app">

  <!-- QUEUE (home) -->
  <section class="screen" id="s-queue">
    <div class="between strip">
      <span class="row" style="gap:6px;color:#BFF8FF"><span class="dot" id="pcDot"></span><span id="pcLine">—</span></span>
      <span class="muted" id="nextRun"></span>
    </div>
    <div class="between" style="margin-top:16px;align-items:flex-end">
      <div class="col">
        <span class="lbl">Queue</span>
        <span class="grot" id="qCount" style="font-size:40px;font-weight:700;letter-spacing:-1.5px;line-height:1">…</span>
      </div>
      <div class="row" style="gap:8px">
        <button class="iconbtn" id="openBrief" aria-label="Morning brief"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6.3 6.3 4.9 4.9M19.1 19.1l-1.4-1.4M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/><circle cx="12" cy="12" r="4"/></svg></button>
        <button class="iconbtn" id="refresh" aria-label="Refresh"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></button>
      </div>
    </div>
    <div class="chips" id="qFilters" style="margin-top:14px"></div>
    <div id="deckWrap"></div>
    <div class="strip muted small" id="syncLine" style="text-align:center;margin-top:18px"></div>
  </section>

  <!-- TERRITORY -->
  <section class="screen" id="s-leads">
    <div class="between">
      <button class="iconbtn" data-go="queue" aria-label="Back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <span class="grot" style="font-size:20px;font-weight:700">Territory</span>
      <button class="iconbtn" id="addLeadBtn" aria-label="Add lead"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div class="seg" id="leadSeg" style="grid-template-columns:repeat(3,1fr);margin-top:14px">

<script>
(() => {
'use strict';
const VERSION = '1.0.0';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem('mhq_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('mhq_' + k, JSON.stringify(v)); } catch (e) {} }
};
const uid = (p) => p + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);

/* ---------- time (India) ---------- */
const ist = () => new Date(Date.now() + (330 + new Date().getTimezoneOffset()) * 60000);
const pad = (n) => String(n).padStart(2, '0');
const dstr = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayIST = () => dstr(ist());
const nowIST = () => { const d = ist(); return dstr(d) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return dstr(d); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5);
const parseDay = (s) => { const m = /(\d{4})-(\d{2})-(\d{2})/.exec(String(s || '')); return m ? m[0] : ''; };
const fmtDay = (s) => { const d = parseDay(s); if (!d) return s || ''; const x = new Date(d + 'T00:00:00'); return x.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }); };
const inr = (n) => '₹' + Math.round(n).toLocaleString('en-IN');

/* ---------- haptics & tilt ---------- */
const HAP = { tap: 8, soft: 5, swipe: 22, ok: [12, 50, 22], err: [40, 60, 40], hold: 15 };

document.addEventListener('pointerdown', (e) => { if (e.target.closest('button,a,.lrow,.qline,select')) hap('tap'); }, { passive: true });
let tiltOn = false;
function startTilt() {
  if (tiltOn) return;
  const go = () => {
    tiltOn = true;
    window.addEventListener('deviceorientation', (e) => {
      if (e.beta == null) return;
      const x = Math.max(-14, Math.min(14, (e.gamma || 0) * .5));

      document.documentElement.style.setProperty('--tx', x.toFixed(1) + 'deg');
      document.documentElement.style.setProperty('--ty', y.toFixed(1) + 'deg');
    });
  };
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(r => { if (r === 'granted') go(); }).catch(() => {});
  } else go();
}
document.addEventListener('click', startTilt, { once: true });

/* ---------- toast & sheet ---------- */
let toastT;
function toast(msg, kind) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); hap(kind === 'err' ? 'err' : 'ok'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }
let sheetClose = null;
function sheet(html, mount, onClose) {

  sheetClose = onClose || null; if (mount) mount(s); hap('soft');
}
function closeSheet() { $('#sheet').classList.remove('on'); $('#sheetBg').classList.remove('on'); $('#sheet').innerHTML = ''; const f = sheetClose; sheetClose = null; if (f) f(); }
$('#sheetBg').addEventListener('click', closeSheet);
(() => { // drag the sheet down to close
  let y0 = null, dy = 0; const s = $('#sheet');
  s.addEventListener('touchstart', (e) => { if (s.scrollTop <= 0) { y0 = e.touches[0].clientY; dy = 0; } }, { passive: true });
  s.addEventListener('touchmove', (e) => { if (y0 == null) return; dy = e.touches[0].clientY - y0; if (dy > 0) s.style.transform = 'translateY(' + dy + 'px)'; }, { passive: true });
  s.addEventListener('touchend', () => { if (y0 == null) return; s.style.transform = ''; if (dy > 110) closeSheet(); y0 = null; });
})();

/* ---------- API + outbox ---------- */
const S = { url: LS.get('url', ''), key: LS.get('key', ''), data: LS.get('data', null), loading: false, lastSync: LS.get('lastSync', '') };
async function api(action, data, cid, timeout = 60000) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), timeout);
  let r;
  try {
    r = await fetch(S.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: S.key, action, data, cid }), redirect: 'follow', cache: 'no-store', credentials: 'omit', signal: ctl.signal });
  } catch (e) { const err = new Error('offline'); err.net = true; throw err; } finally { clearTimeout(t); }
  let j; try { j = await r.json(); } catch (e) { const err = new Error('The server sent an unexpected reply'); err.net = true; throw err; }
  if (!j.ok) { const err = new Error(j.error === 'auth' ? 'The app key is wrong — open Agents → settings' : j.error); err.auth = j.error === 'auth'; throw err; }
  return j.data;
}
const DB = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => { const r = indexedDB.open('mohey-hq', 1); r.onupgradeneeded = () => r.result.createObjectStore('outbox', { keyPath: 'cid' }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction('outbox', mode); const st = t.objectStore('outbox'); const out = fn(st); t.oncomplete = () => res(out && out.result !== undefined ? out.result : out); t.onerror = () => rej(t.error); }); };
  return { put: (v) => tx('readwrite', s => s.put(v)), del: (k) => tx('readwrite', s => s.delete(k)), all: () => tx('readonly', s => s.getAll()) };
})();
let flushing = false;
async function send(action, data, label) {
  const item = { cid: uid('c'), action, data, label: label || action, ts: Date.now(), tries: 0 };
  await DB.put(item); updateOutbox(); flush(); return item.cid;
}
async function flush() {
  if (flushing || !S.url) return; flushing = true;
  try {
    const items = (await DB.all()).sort((a, b) => a.ts - b.ts);
    for (const it of items) {
      try { await api(it.action, it.data, it.cid, 120000); await DB.del(it.cid); }
      catch (e) {
        if (e.net) break;
        it.tries = (it.tries || 0) + 1;
        if (it.tries >= 3) { await DB.del(it.cid); toast('Couldn\'t save: ' + it.label + ' — ' + e.message, 'err'); }
        else await DB.put(it);
      }
    }
  } finally { flushing = false; updateOutbox(); }
}
async function updateOutbox() {
  let n = 0; try { n = (await DB.all()).length; } catch (e) {}
  const line = $('#syncLine'); if (!line) return;
  const when = S.lastSync ? 'updated ' + S.lastSync.slice(11) : '';
  line.textContent = (n ? n + ' waiting to send · ' : '') + (navigator.onLine ? when : 'offline · ' + when);
}
window.addEventListener('online', () => { flush(); load(); });
window.addEventListener('offline', updateOutbox);
setInterval(flush, 30000);

/* ---------- data ---------- */
async function load(manual) {
  if (!S.url || S.loading) return; S.loading = true;
  if (manual) $('#ptr').classList.add('spin');
  try {
    const d = await api('bootstrap', {}, null, 45000);
    S.data = d; LS.set('data', d); S.lastSync = nowIST(); LS.set('lastSync', S.lastSync);
    renderAll(); if (manual) toast('Up to date');
    maybeBrief();
  } catch (e) {
    if (e.auth) { showPair(e.message); }
    else if (manual) toast(e.net ? 'Offline — showing saved data' : e.message, 'err');
  } finally { S.loading = false; $('#ptr').classList.remove('spin'); updateOutbox(); }
}
const D = () => S.data || { leads: [], tenders: [], requests: [], log: [], settings: {}, hidden: [], products: [] };
function patchLead(id, set, note) {
  const l = D().leads.find(x => x['Lead ID'] === id); if (!l) return;
  Object.assign(l, set); if (note) l.Notes = (l.Notes ? l.Notes + '\n' : '') + '[' + todayIST() + '] ' + note;
  LS.set('data', S.data);
}
function saveLead(id, set, note, label) { patchLead(id, set, note); send('leadUpdate', { id, set, note }, label || ('lead ' + id)); renderAll(); }

/* ---------- agents & schedule ---------- */
const AGENTS = [
  { name: 'Lead Hunter', where: 'cloud', days: [1, 4], t: '08:17' },
  { name: 'Follow-up Chaser', where: 'cloud', days: [3, 6], t: '08:43' },
  { name: 'Competitor Watcher', where: 'cloud', days: [5], t: '08:37' },
  { name: 'Manager', label: 'Monday brief', where: 'cloud', days: [1], t: '09:13' },
  { name: 'Tender Watcher', where: 'cloud', days: [2, 4, 6], t: '08:29' },
  { name: 'Catalogue Agent', where: 'cloud', days: [1, 2, 3, 4, 5, 6], t: '08:51' },
  { name: 'Repeat-customer agent', label: 'Repeat customers', where: 'cloud', days: [1], t: '08:03' },
  { name: 'Request Runner', where: 'cloud', hourly: true },
  { name: 'Google Review Replies', label: 'Review replies', where: 'pc', days: [3, 6], t: '11:45', lt: '20:47' },
  { name: 'Instagram Lead Sweep', label: 'Instagram sweep', where: 'pc', days: [5], t: '11:45', lt: '20:23' },
  { name: 'Weekly Google post', where: 'pc', days: [2], t: '11:13', lt: '20:11' },
  { name: 'Catafy Uploader', where: 'pc', days: [0, 1, 2, 3, 4, 5, 6], t: '12:13', lt: '21:07' }
];
const mode = () => (D().settings.working_computer || 'Store');
function todaysRuns() {
  const d = ist(), dow = d.getDay(), m = mode(), runs = [];
  AGENTS.forEach(a => {
    if (a.hourly) { const h = d.getMinutes() < 7 ? d.getHours() : d.getHours() + 1; if (h >= 7 && h <= 23) runs.push({ t: pad(h) + ':07', name: a.name, label: 'Request Runner · hourly', where: 'CLOUD' }); return; }
    if (!a.days.includes(dow)) return;
    if (a.where === 'cloud') runs.push({ t: a.t, name: a.name, label: a.label || a.name, where: 'CLOUD' });
    else {
      runs.push({ t: a.t, name: a.name, label: a.label || a.name, where: 'STORE', skip: m === 'Laptop' });
      runs.push({ t: a.lt, name: a.name, label: a.label || a.name, where: 'LAPTOP', skip: m === 'Store', maybe: m === 'Auto' });
    }
  });
  return runs.sort((x, y) => x.t.localeCompare(y.t));
}
function nextRun() { const n = pad(ist().getHours()) + ':' + pad(ist().getMinutes()); return todaysRuns().find(r => r.t > n && !r.skip); }
function seen(k) { const v = D().settings[k]; return v && /\d{4}-\d{2}-\d{2}/.test(v) ? v : ''; }

/* ---------- queue ---------- */
const snoozed = () => LS.get('snooze', {});
function snooze(key, days = 1) { const s = snoozed(); s[key] = addDays(todayIST(), days); LS.set('snooze', s); }
function isSnoozed(key) { const s = snoozed()[key]; return s && s > todayIST(); }
const phoneOf = (p) => { let d = String(p || '').split(/[,/;]/)[0].replace(/\D/g, ''); if (d.length === 10) d = '91' + d; if (d.length === 11 && d[0] === '0') d = '91' + d.slice(1); return d.length >= 11 ? d : ''; };
function buildQueue() {
  const data = D(), t = todayIST(), items = [], hidden = new Set(data.hidden || []);
  data.requests.filter(r => r.Status === 'Ready to bill').forEach(r => items.push({ key: 'upi:' + r['Request ID'], kind: 'upi', pri: 0, r }));
  data.requests.filter(r => r.Status === 'Failed' && parseDay(r.Finished || r.Created) >= addDays(t, -7)).forEach(r => { const k = 'fail:' + r['Request ID']; if (!hidden.has(k)) items.push({ key: k, kind: 'fail', pri: 1, r }); });
  data.tenders.filter(x => x.Status === 'Open').forEach(x => { const close = parseDay(x['Bid closing date']); if (close && close < t) return; items.push({ key: 'tender:' + x['Tender ID'], kind: 'tender', pri: close && daysBetween(t, close) <= 7 ? 1 : 3, x, close }); });
  data.leads.forEach(l => {
    const st = l.Status || 'New', fu = parseDay(l['Next follow-up']), sc = l.Score;
    if ((st === 'Contacted' || st === 'Replied') && fu && fu <= t) items.push({ key: 'fu:' + l['Lead ID'], kind: 'fu', pri: 2, l });
    else if (st === 'New' && sc === 'Hot') items.push({ key: 'lead:' + l['Lead ID'], kind: 'lead', pri: 2, l });
    else if (st === 'New' && sc === 'Warm') items.push({ key: 'lead:' + l['Lead ID'], kind: 'lead', pri: 5, l });
  });
  data.log.filter(g => g['Needs Dhruv'] && parseDay(g.Date) >= addDays(t, -7)).forEach(g => {
    const k = 'need:' + (g.Date + '|' + g.Agent + '|' + g['Needs Dhruv']).slice(0, 180);
    if (!hidden.has(k)) items.push({ key: k, kind: 'need', pri: 4, g });
  });
  return items.filter(i => !isSnoozed(i.key)).sort((a, b) => a.pri - b.pri);
}
const KIND_FILTERS = [['all', 'All'], ['leads', 'Leads'], ['tenders', 'Tenders'], ['bills', 'Bills'], ['agents', 'Agents']];
const kindGroup = (k) => ({ lead: 'leads', fu: 'leads', tender: 'tenders', upi: 'bills', fail: 'agents', need: 'agents' }[k]);
let qFilter = 'all';
function renderQueue() {
  const all = buildQueue(); const items = qFilter === 'all' ? all : all.filter(i => kindGroup(i.kind) === qFilter);
  const count = (g) => g === 'all' ? all.length : all.filter(i => kindGroup(i.kind) === g).length;
  $('#qCount').textContent = all.length ? all.length + ' to clear' : 'All clear';
  $('#qFilters').innerHTML = KIND_FILTERS.map(([k, n]) => `<button class="chip ${qFilter === k ? 'on' : count(k) ? '' : 'dim'}" data-f="${k}">${n} ${count(k)}</button>`).join('');
  // status strip
  const m = mode(); const lastStore = seen('store_last_seen'), lastLap = seen('laptop_last_seen');
  const pc = m === 'Laptop' ? 'LAPTOP' : m === 'Auto' ? 'AUTO' : 'STORE PC';
  const last = m === 'Laptop' ? lastLap : lastStore;
  const fresh = last && daysBetween(parseDay(last), todayIST()) <= 1;
  $('#pcDot').className = 'dot ' + (fresh ? 'live' : ''); $('#pcDot').style.background = fresh ? '' : 'var(--dim)';
  $('#pcLine').textContent = pc + (last ? ' · SEEN ' + fmtDay(last).toUpperCase() : ' · IN CHARGE');
  const nr = nextRun(); $('#nextRun').textContent = nr ? 'NEXT ' + nr.t : '';

    w.innerHTML = `<div class="done-state"><div class="holo" style="width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--bg)"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12l5 5L20 7"/></svg></div><span class="grot" style="font-size:24px;font-weight:700">${qFilter === 'all' ? 'Queue clear' : 'Nothing here'}</span><span class="muted">${qFilter === 'all' ? 'Hold the camera button to capture something, or check Territory for more leads.' : 'Try All.'}</span></div>`;
    return;
  }

    <div class="actions">${actionButtons(items[0])}</div>`;
  bindDeck(items[0]);
}
function badge(it) {
  if (it.kind === 'lead') return `<span class="pill ${it.l.Score === 'Hot' ? 'p-hot' : 'p-warm'}">${esc((it.l.Score || '').toUpperCase())} · NEW</span>`;
  if (it.kind === 'fu') { const d = daysBetween(parseDay(it.l['Last contact']) || todayIST(), todayIST()); return `<span class="pill p-cool">FOLLOW-UP · ${d >= 14 ? 'FINAL' : d >= 7 ? '2ND' : '1ST'}</span>`; }
  if (it.kind === 'tender') return `<span class="pill ${it.pri === 1 ? 'p-hot' : 'p-cool'}">TENDER${it.close ? ' · CLOSES ' + esc(fmtDay(it.close).toUpperCase()) : ''}</span>`;
  if (it.kind === 'upi') return '<span class="pill p-ok">UPI BILLS · READY</span>';
  if (it.kind === 'fail') return '<span class="pill p-warm">REQUEST FAILED</span>';

}
const HINTS = {
  lead: ['← LATER', '↑ CALL', 'WHATSAPP →'], fu: ['← LATER', '↑ CALL', 'NUDGE →'], tender: ['← SKIP', '', 'INTERESTED →'],
  upi: ['← LATER', '', 'BILL IT →'], fail: ['← LATER', '', 'GOT IT →'], need: ['← LATER', '', 'DONE →']
};
const STAMPS = { lead: ['LATER', 'CALL', 'WHATSAPP'], fu: ['LATER', 'CALL', 'NUDGE'], tender: ['SKIP', '', 'INTERESTED'], upi: ['LATER', '', 'BILL IT'], fail: ['LATER', '', 'GOT IT'], need: ['LATER', '', 'DONE'] };
function cardHTML(it) {
  let title = '', sub = '', body = '', side = '';
  if (it.kind === 'lead' || it.kind === 'fu') {
    const l = it.l; title = l.Name; sub = [l.Type, l.Town].filter(Boolean).join(' · '); side = l['Lead ID'] + (l.Town ? ' · ' + l.Town.toUpperCase() : '');
    body = it.kind === 'fu' ? 'Last contact ' + esc(fmtDay(l['Last contact'])) + '. ' + esc(followText(l)) : (l['Why it is a lead'] ? esc(l['Why it is a lead']) : '“' + esc((l['Pitch (WhatsApp draft)'] || '').slice(0, 160)) + '…”');
  } else if (it.kind === 'tender') {
    const x = it.x; title = x['Buyer / Department'] || 'Tender'; sub = [x.Items, x.Location].filter(Boolean).join(' · '); side = x.Portal || '';
    body = [x['Quantity / Value'], x['Eligibility / EMD notes']].filter(Boolean).map(esc).join('<br>');
  } else if (it.kind === 'upi') {
    title = it.r.Summary || 'UPI bills'; sub = 'Run the UPI Bills task on the Vyapar computer'; body = esc(it.r['Result note'] || '');
  } else if (it.kind === 'fail') {
    title = it.r.Summary || it.r.Type; sub = it.r.Type; body = esc(it.r['Result note'] || 'No reason given');
  } else { title = it.g['Needs Dhruv']; sub = it.g.Agent + ' · ' + fmtDay(it.g.Date); body = esc(it.g.Summary || ''); }
  const h = HINTS[it.kind], s = STAMPS[it.kind];
  return `<div class="qcard top" id="topCard"><div class="inner">

async function compress(file, max = 1600) {
  const img = await new Promise((res, rej) => { const u = URL.createObjectURL(file); const i = new Image(); i.onload = () => { URL.revokeObjectURL(u); res(i); }; i.onerror = rej; i.src = u; });
  const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const url = c.toDataURL('image/jpeg', .82); return { name: (file.name || 'photo').replace(/\.\w+$/, '') + '.jpg', mime: 'image/jpeg', b64: url.split(',')[1], preview: url };
}
const fileToB64 = (file) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(file); });
